<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOODL. Support</title>
    <style>
      :root {
        color-scheme: dark;
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.72);
        --bg-gradient: linear-gradient(180deg, #83b84b 0%, #a9b84d 36%, #49b99e 70%, #238fcf 100%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100%;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(1100px 700px at 50% 110%, rgba(0, 0, 0, 0.28), transparent 55%),
          radial-gradient(900px 520px at 50% -10%, rgba(255, 255, 255, 0.12), transparent 60%),
          var(--bg-gradient);
        overflow: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .stage {
        width: 100%;
        height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(14px, 3vw, 28px);
      }

      .frame {
        position: relative;
        aspect-ratio: 9 / 16;
        height: min(94vh, calc(92vw * 16 / 9));
        width: min(92vw, calc(94vh * 9 / 16));
        border-radius: 26px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 32px 88px rgba(0, 0, 0, 0.45);
      }

      .frameInner {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .frameScroll {
        flex: 1;
        overflow: auto;
        padding: 18px 16px;
        display: grid;
        place-items: center;
      }

      .frameScroll::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      .sheet {
        width: min(520px, 100%);
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(0, 0, 0, 0.14);
        backdrop-filter: blur(10px);
        padding: 22px 18px;
        text-align: center;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
      }

      .brand img {
        width: min(240px, 70%);
        height: auto;
        border-radius: 0;
        mix-blend-mode: screen;
        display: block;
        margin: 0 auto 16px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 34px;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.78);
        font-size: 16px;
        line-height: 1.5;
      }

      .email {
        margin: 14px auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 18px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: rgba(255, 255, 255, 0.92);
        font-weight: 900;
        letter-spacing: -0.01em;
      }

      .email:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      .footerBar {
        padding: 12px 16px 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        background: linear-gradient(180deg, rgba(6, 7, 20, 0.18), rgba(6, 7, 20, 0.52));
        text-align: center;
        color: rgba(255, 255, 255, 0.72);
        font-size: 12px;
      }

      .footerLinks {
        display: inline-flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .footerLinks a {
        border-bottom: 1px solid transparent;
        padding-bottom: 2px;
      }

      .footerLinks a:hover {
        color: rgba(255, 255, 255, 0.92);
        border-color: rgba(255, 255, 255, 0.3);
      }

      @media (max-width: 540px) {
        .stage {
          padding: 0;
        }

        .frame {
          width: 100%;
          height: 100vh;
          border-radius: 0;
          border: none;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="frame">
        <div class="frameInner">
          <div class="frameScroll">
            <div class="sheet">
              <div class="brand">
                <img src="/logo.png" alt="DOODL." width="240" height="240" />
              </div>

              <h1>Support</h1>
              <p>For help, please email:</p>
              <a class="email" href="mailto:anthonyvvza@gmail.com">anthonyvvza@gmail.com</a>
              <p>We typically respond within 24 hours during business days.</p>
            </div>
          </div>

          <footer class="footerBar">
            <div class="footerLinks">
              <a href="/privacy/">privacy</a>
              <a href="/terms/">terms</a>
              <a href="/support/">support</a>
              <span>© DOODL. 2025</span>
            </div>
          </footer>
        </div>
      </div>
    </div>
  </body>
</html>
